<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrakharBot — chat with Prakhar Sharma</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  // Set the theme before first paint so there's no flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem('pb-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();
</script>
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph">&gt;<span class="cursor"></span></span>
      PRAKHAR_BOT
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle dark or light mode">
        <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <div id="authArea"></div>
    </div>
  </header>

  <main class="app-main" id="appMain">

    <div class="hero" id="heroView">
      <h1 class="hero-greeting" id="heroGreeting"><span class="prompt-mark">&gt;</span>Good afternoon</h1>
      <p class="hero-sub">Ask me anything about Prakhar's work, projects, or how to get in touch.</p>
    </div>

    <div class="message-list" id="messageList" style="display:none;">
      <div class="message-inner" id="messageInner"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composerForm">
        <textarea id="messageInput" rows="1" placeholder="How can I help you today?"></textarea>
        <div class="composer-row">
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </form>
      <p class="composer-hint">PrakharBot can be wrong sometimes — it's still just answering from what it knows about Prakhar.</p>
      <div class="admin-link"><a href="/admin/login">Admin</a></div>
    </div>

  </main>
</div>

<!-- Auth modal -->
<div class="modal-overlay" id="authModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title" id="authTitle">Welcome</h2>
      <button class="close-x" id="authClose" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="modal-sub">Sign up or log in to keep chatting with PrakharBot.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Log in</button>
      <button class="tab-btn" data-tab="signup">Sign up</button>
    </div>

    <p class="form-error" id="authError"></p>

    <form class="auth-panel active" id="loginPanel" data-panel="login">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <form class="auth-panel" id="signupPanel" data-panel="signup">
      <div class="field">
        <label for="signupName">Name</label>
        <input type="text" id="signupName" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
